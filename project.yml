name: OloVPN
options:
  bundleIdPrefix: app.olo
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"

targets:
  OloVPN:
    type: application
    platform: macOS
    sources:
      - path: OloVPN
        excludes:
          - "**/*.md"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.olo.vpn
        INFOPLIST_KEY_CFBundleDisplayName: Olo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSCameraUsageDescription: Olo сканирует QR‑коды серверов VPN
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: OloVPN/OloVPN.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: PacketTunnel
        embed: true
        codeSign: true

  PacketTunnel:
    type: app-extension
    platform: macOS
    sources:
      - path: PacketTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.olo.vpn.PacketTunnel
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        OTHER_LDFLAGS: "$(inherited) -lresolv"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies:
      - framework: Vendor/Libbox.xcframework
        embed: false
      - sdk: Network.framework
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd

  OloVPN-iOS:
    type: application
    platform: iOS
    sources:
      - path: OloVPN
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.olo.vpn
        INFOPLIST_KEY_CFBundleDisplayName: Olo
        INFOPLIST_KEY_NSCameraUsageDescription: Olo сканирует QR‑коды серверов VPN
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: OloVPN/OloVPN.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - target: PacketTunnel-iOS
        embed: true
        codeSign: true

  PacketTunnel-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.olo.vpn.PacketTunnel
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        OTHER_LDFLAGS: "$(inherited) -lresolv"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - framework: Vendor/Libbox.xcframework
        embed: false
      - sdk: Network.framework
      - sdk: NetworkExtension.framework
      - sdk: UIKit.framework
      - sdk: libresolv.tbd

schemes:
  OloVPN:
    build:
      targets:
        OloVPN: all
        PacketTunnel: all
    run:
      config: Debug
  OloVPN-iOS:
    build:
      targets:
        OloVPN-iOS: all
        PacketTunnel-iOS: all
    run:
      config: Debug
